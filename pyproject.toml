[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-statsapi"
version = "1.2.0"
description = "Wrapper to access stats API data from MLB"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# The MLB Stats movement-source plugin for biomech_studio. Adds Playwright for
# interactive Okta browser login (run `playwright install chromium` after).
# Deliberately does NOT list biomech-studio: the plugin only ever loads inside a
# running biomech_studio process, which provides the movement-source contract.
biomech = [
    "playwright>=1.49",
]

[tool.setuptools]
packages = ["mlb_statsapi", "mlb_statsapi.movement_source"]
