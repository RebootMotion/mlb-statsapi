[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mlb-statsapi"
version = "1.2.0"
description = "Wrapper to access stats API data from MLB"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pandas",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# Interactive Okta browser login (mlb_statsapi.auth.login_with_browser).
# After install, run: playwright install chromium
auth = [
    "playwright>=1.49",
]

[tool.setuptools]
packages = ["mlb_statsapi"]
